services:
  app:
    build: .
    container_name: automatiza-app
    restart: always
    ports:
      - "8080:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/automatiza?schema=public
      - DB_HOST=db
      - DB_PORT=5432
      - NODE_ENV=production
      - STORAGE_PATH=/data/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-network
    volumes:
      - storage-data:/data/storage

  db:
    image: postgres:16-alpine
    container_name: automatiza-db
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=automatiza
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d automatiza"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Database is not exposed to the internet (ports omitted)

volumes:
  postgres-data:
  storage-data:

networks:
  internal-network:
    driver: bridge
